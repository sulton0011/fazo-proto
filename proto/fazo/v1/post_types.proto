syntax = "proto3";

package fazo.v1;

import "fazo/v1/file_types.proto";
import "fazo/v1/post_access_request_types.proto";
import "fazo/v1/post_extras.proto";

option go_package = "fazo-service/gen/fazo/v1;fazov1";

enum PostType {
    POST_TYPE_UNSPECIFIED  = 0;
    POST_TYPE_GLOBAL_CHAT  = 1;
    POST_TYPE_SHOP_CHAT    = 2;
    POST_TYPE_MEDIA_CHAT   = 3;
}

message Post {
    string id                        = 1  [json_name = "id"];
    string creator_id                = 2  [json_name = "creator_id"];
    string title                     = 3  [json_name = "title"];
    string description               = 4  [json_name = "description"];
    repeated FileRecord media        = 5  [json_name = "media"];
    repeated string tags             = 6  [json_name = "tags"];
    int32 likes                      = 7  [json_name = "likes"];
    string reactions                 = 8  [json_name = "reactions"];   // JSON string: {"👍":5,"❤️":3}
    int64 delete_at                  = 9  [json_name = "delete_at"];   // 0 = abadiy
    int64 created_at                 = 10 [json_name = "created_at"];
    PostType type                    = 11 [json_name = "type"];
    bool is_public                   = 12 [json_name = "is_public"];
    int64 price                      = 13 [json_name = "price"];       // so'm birligida
    AccessStatus access_status       = 14 [json_name = "access_status"]; // privat postlar uchun: NONE/PENDING/ACCEPTED/REJECTED; public postlarda UNSPECIFIED
    // Unique viewers. Filled when views_visible is true: on video posts for
    // everyone, on other posts only for the author (otherwise 0).
    int64 view_count                 = 15 [json_name = "view_count"];
    bool views_visible               = 16 [json_name = "views_visible"];

    // ── Elon ad fields (POST_TYPE_SHOP_CHAT; zero values on other types) ──
    // ElonService.ListAdCategories id; 0 = uncategorised.
    int32 category_id                = 17 [json_name = "category_id"];
    // A paid Top promotion is running (top_until > now).
    bool is_top                      = 18 [json_name = "is_top"];
    int64 top_until                  = 19 [json_name = "top_until"];
    // Last bump (PromoteAd type "bump"); 0 = never.
    int64 bumped_at                  = 20 [json_name = "bumped_at"];
    string region                    = 21 [json_name = "region"];
    string city                      = 22 [json_name = "city"];
    AdCondition condition            = 23 [json_name = "condition"];
    // Set when the category kind is JOB.
    JobDetails job                   = 24 [json_name = "job"];
    // Employer company (job ads posted as a company); filled by ElonService.
    CompanySummary company           = 25 [json_name = "company"];
    AdStatus ad_status               = 26 [json_name = "ad_status"];
    // Job ads: end of the paid publication period (unix s); 0 = no limit.
    int64 published_until            = 27 [json_name = "published_until"];
    // ISO 4217 currency of price (default "UZS").
    string currency                  = 28 [json_name = "currency"];

    // ── Global community fields (POST_TYPE_GLOBAL_CHAT only) ──
    CommunityInfo community          = 29 [json_name = "community"];
}

message CreatePostRequest {
    string title              = 1 [json_name = "title"];
    string description        = 2 [json_name = "description"];
    repeated string media_ids = 3 [json_name = "media_ids"];  // file_store.id lar
    repeated string tags      = 4 [json_name = "tags"];
    int64 delete_after        = 5 [json_name = "delete_after"];  // seconds from now, 0 = abadiy
    string id                 = 6 [json_name = "id"];            // optional: client ULID, bo'sh bo'lsa server generatsiya qiladi
    PostType type             = 7 [json_name = "type"];          // default: POST_TYPE_GLOBAL_CHAT
    optional bool is_public   = 8 [json_name = "is_public"];          // null = default true, false = private
    int64 price               = 9 [json_name = "price"];              // shop_chat da majburiy (> 0)
    // global_chat only; UNSPECIFIED = other.
    CommunityCategory community_category = 10 [json_name = "community_category"];
}

message CreatePostResponse {
    Post post = 1 [json_name = "post"];
}

message GetPostRequest {
    string id = 1 [json_name = "id"];
}

message GetPostResponse {
    Post post = 1 [json_name = "post"];
}

message GetAllPostsRequest {
    string cursor       = 1 [json_name = "cursor"];      // ULID, optional — cursor-based pagination
    int32 page_size     = 2 [json_name = "page_size"];   // default 20, max 50
    string search       = 3 [json_name = "search"];      // ILIKE '%search%' on title+tags
    PostType type       = 4 [json_name = "type"];        // 0 = filter yo'q
    optional bool is_public  = 5 [json_name = "is_public"];  // null = hammasi, true = public, false = private
    string created_by   = 6 [json_name = "created_by"];  // user ID, bo'sh = hammasi
}

message GetAllPostsResponse {
    repeated Post posts = 1 [json_name = "posts"];
    string next_cursor  = 2 [json_name = "next_cursor"];
    bool has_more       = 3 [json_name = "has_more"];
}

message UpdatePostRequest {
    string id                = 1 [json_name = "id"];
    string title             = 2 [json_name = "title"];
    string description       = 3 [json_name = "description"];
    repeated string tags     = 4 [json_name = "tags"];
    optional bool is_public  = 5 [json_name = "is_public"];   // null = o'zgartirmaslik
    int64 price              = 6 [json_name = "price"];
    // global_chat only; UNSPECIFIED = unchanged.
    CommunityCategory community_category = 7 [json_name = "community_category"];
}

message UpdatePostResponse {
    Post post = 1 [json_name = "post"];
}

message DeletePostRequest {
    string id = 1 [json_name = "id"];
}

message DeletePostResponse {}

message LikePostRequest {
    string id  = 1 [json_name = "id"];
    bool liked = 2 [json_name = "liked"];  // true = +1, false = -1
}

message LikePostResponse {
    Post post = 1 [json_name = "post"];
}

// RecordPostView counts one unique view per user per post. The client sends
// it once a video has played >= 2 s or a picture post stayed on screen >= 1 s;
// later calls only raise the stored watch time (a ranking signal).
message RecordPostViewRequest {
    string post_id = 1 [json_name = "post_id"];
    // Milliseconds watched in this session (0 for pictures).
    int64 watch_ms = 2 [json_name = "watch_ms"];
    // Video length in ms when known; lets the server compute completion.
    int64 duration_ms = 3 [json_name = "duration_ms"];
}

message RecordPostViewResponse {
    // True when this call created the user's first view of the post.
    bool counted     = 1 [json_name = "counted"];
    int64 view_count = 2 [json_name = "view_count"];
}

enum FeedKind {
    // Recommended ("Siz uchun").
    FEED_KIND_FOR_YOU   = 0;
    // Only accounts the caller actively follows, newest first ("Obunalar").
    FEED_KIND_FOLLOWING = 1;
}

message GetFeedRequest {
    FeedKind kind   = 1 [json_name = "kind"];
    // Opaque; empty for the first page.
    string cursor   = 2 [json_name = "cursor"];
    int32 page_size = 3 [json_name = "page_size"];  // default 20, max 50
    // 0 = all types; the media page passes POST_TYPE_MEDIA_CHAT.
    PostType type   = 4 [json_name = "type"];
}

message GetFeedResponse {
    repeated Post posts = 1 [json_name = "posts"];
    string next_cursor  = 2 [json_name = "next_cursor"];
}
