syntax = "proto3";

package fazo.v1;

import "fazo/v1/auth_types.proto";
import "google/api/annotations.proto";

option go_package = "fazo-service/gen/fazo/v1;fazov1";

service AuthService {
    rpc Register(RegisterRequest) returns (RegisterResponse) {
        option (google.api.http) = {
            post: "/v1/auth/register"
            body: "*"
        };
    }

    rpc Login(LoginRequest) returns (LoginResponse) {
        option (google.api.http) = {
            post: "/v1/auth/login"
            body: "*"
        };
    }

    rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
        option (google.api.http) = {
            post: "/v1/auth/refresh"
            body: "*"
        };
    }

    rpc Logout(LogoutRequest) returns (LogoutResponse) {
        option (google.api.http) = {
            post: "/v1/auth/logout"
            body: "*"
        };
    }

    rpc UpdateDeviceToken(UpdateDeviceTokenRequest) returns (UpdateDeviceTokenResponse) {
        option (google.api.http) = {
            post: "/v1/auth/device-token"
            body: "*"
        };
    }

    rpc SendRegistrationOtp(SendRegistrationOtpRequest) returns (SendRegistrationOtpResponse) {
        option (google.api.http) = {
            post: "/v1/auth/phone/otp"
            body: "*"
        };
    }

    rpc SendPasswordResetOtp(SendPasswordResetOtpRequest) returns (SendPasswordResetOtpResponse) {
        option (google.api.http) = {
            post: "/v1/auth/password/otp"
            body: "*"
        };
    }

    rpc VerifyOtp(VerifyOtpRequest) returns (VerifyOtpResponse) {
        option (google.api.http) = {
            post: "/v1/auth/otp/verify"
            body: "*"
        };
    }

    rpc RegisterWithPhone(RegisterWithPhoneRequest) returns (RegisterResponse) {
        option (google.api.http) = {
            post: "/v1/auth/register/phone"
            body: "*"
        };
    }

    rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
        option (google.api.http) = {
            post: "/v1/auth/password/reset"
            body: "*"
        };
    }

    // Sends a login OTP to a verified phone (purpose "login").
    rpc SendLoginOtp(SendLoginOtpRequest) returns (SendLoginOtpResponse) {
        option (google.api.http) = {
            post: "/v1/auth/login/otp"
            body: "*"
        };
    }

    // Logs in with a verification_token obtained via VerifyOtp (purpose "login").
    rpc LoginWithPhone(LoginWithPhoneRequest) returns (LoginResponse) {
        option (google.api.http) = {
            post: "/v1/auth/login/phone"
            body: "*"
        };
    }

    // AttachPhone flow for accounts without a verified phone (username +
    // password sign-ups): send a code, VerifyOtp it, then AttachPhone. A
    // verified phone opens the wallet and premium.
    rpc SendAttachPhoneOtp(SendAttachPhoneOtpRequest) returns (SendAttachPhoneOtpResponse) {
        option (google.api.http) = {
            post: "/v1/auth/phone/attach/otp"
            body: "*"
        };
    }

    rpc AttachPhone(AttachPhoneRequest) returns (AttachPhoneResponse) {
        option (google.api.http) = {
            post: "/v1/auth/phone/attach"
            body: "*"
        };
    }

    // Active sessions (one per signed-in device), Telegram style.
    rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
        option (google.api.http) = {
            get: "/v1/auth/sessions"
        };
    }

    // Ends one other session. A session younger than 24 hours may not end
    // older ones (FailedPrecondition, reason in the message: "session too new").
    rpc TerminateSession(TerminateSessionRequest) returns (TerminateSessionResponse) {
        option (google.api.http) = {
            post: "/v1/auth/sessions/{session_id}/terminate"
            body: "*"
        };
    }

    // Ends every session except the caller's (same 24-hour rule).
    rpc TerminateOtherSessions(TerminateOtherSessionsRequest) returns (TerminateOtherSessionsResponse) {
        option (google.api.http) = {
            post: "/v1/auth/sessions/terminate_others"
            body: "*"
        };
    }

    // Sessions idle longer than this many days end on their own.
    rpc SetSessionTtl(SetSessionTtlRequest) returns (SetSessionTtlResponse) {
        option (google.api.http) = {
            post: "/v1/auth/sessions/ttl"
            body: "*"
        };
    }

    // Two-step verification. When enabled, Login / LoginWithPhone answer
    // two_fa_required + two_fa_token instead of tokens; CheckTwoFa finishes.
    rpc CheckTwoFa(CheckTwoFaRequest) returns (LoginResponse) {
        option (google.api.http) = {
            post: "/v1/auth/2fa/check"
            body: "*"
        };
    }

    // "Forgot password": the extra password is removed 7 days later, at the
    // next sign-in, unless the owner signs in with it before then.
    rpc RequestTwoFaReset(RequestTwoFaResetRequest) returns (RequestTwoFaResetResponse) {
        option (google.api.http) = {
            post: "/v1/auth/2fa/reset"
            body: "*"
        };
    }

    rpc GetTwoFa(GetTwoFaRequest) returns (GetTwoFaResponse) {
        option (google.api.http) = {
            get: "/v1/auth/2fa"
        };
    }

    // Enables or changes the extra password (current_password when enabled).
    rpc SetTwoFa(SetTwoFaRequest) returns (GetTwoFaResponse) {
        option (google.api.http) = {
            post: "/v1/auth/2fa"
            body: "*"
        };
    }

    rpc DisableTwoFa(DisableTwoFaRequest) returns (GetTwoFaResponse) {
        option (google.api.http) = {
            post: "/v1/auth/2fa/disable"
            body: "*"
        };
    }
}
