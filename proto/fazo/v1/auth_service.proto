syntax = "proto3";

package fazo.v1;

import "fazo/v1/auth_types.proto";
import "google/api/annotations.proto";

option go_package = "fazo-service/gen/fazo/v1;fazov1";

service AuthService {
    rpc Register(RegisterRequest) returns (RegisterResponse) {
        option (google.api.http) = {
            post: "/v1/auth/register"
            body: "*"
        };
    }

    rpc Login(LoginRequest) returns (LoginResponse) {
        option (google.api.http) = {
            post: "/v1/auth/login"
            body: "*"
        };
    }

    rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
        option (google.api.http) = {
            post: "/v1/auth/refresh"
            body: "*"
        };
    }

    rpc Logout(LogoutRequest) returns (LogoutResponse) {
        option (google.api.http) = {
            post: "/v1/auth/logout"
            body: "*"
        };
    }

    rpc UpdateDeviceToken(UpdateDeviceTokenRequest) returns (UpdateDeviceTokenResponse) {
        option (google.api.http) = {
            post: "/v1/auth/device-token"
            body: "*"
        };
    }

    rpc SendRegistrationOtp(SendRegistrationOtpRequest) returns (SendRegistrationOtpResponse) {
        option (google.api.http) = {
            post: "/v1/auth/phone/otp"
            body: "*"
        };
    }

    rpc SendPasswordResetOtp(SendPasswordResetOtpRequest) returns (SendPasswordResetOtpResponse) {
        option (google.api.http) = {
            post: "/v1/auth/password/otp"
            body: "*"
        };
    }

    rpc VerifyOtp(VerifyOtpRequest) returns (VerifyOtpResponse) {
        option (google.api.http) = {
            post: "/v1/auth/otp/verify"
            body: "*"
        };
    }

    rpc RegisterWithPhone(RegisterWithPhoneRequest) returns (RegisterResponse) {
        option (google.api.http) = {
            post: "/v1/auth/register/phone"
            body: "*"
        };
    }

    rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
        option (google.api.http) = {
            post: "/v1/auth/password/reset"
            body: "*"
        };
    }

    // Sends a login OTP to a verified phone (purpose "login").
    rpc SendLoginOtp(SendLoginOtpRequest) returns (SendLoginOtpResponse) {
        option (google.api.http) = {
            post: "/v1/auth/login/otp"
            body: "*"
        };
    }

    // Logs in with a verification_token obtained via VerifyOtp (purpose "login").
    rpc LoginWithPhone(LoginWithPhoneRequest) returns (LoginResponse) {
        option (google.api.http) = {
            post: "/v1/auth/login/phone"
            body: "*"
        };
    }
}
