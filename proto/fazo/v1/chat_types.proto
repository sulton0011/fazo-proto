syntax = "proto3";

package fazo.v1;

option go_package = "fazo-service/gen/fazo/v1;fazov1";

message Location {
    double latitude  = 1 [json_name = "latitude"];
    double longitude = 2 [json_name = "longitude"];
    string address   = 3 [json_name = "address"];
}

// ReplyPreview — javob berilgan xabarning yengil ko'rinishi (klient alohida so'rov yubormasligi uchun).
message ReplyPreview {
    string id         = 1 [json_name = "id"];
    string sender_id  = 2 [json_name = "sender_id"];
    string content    = 3 [json_name = "content"];      // qisqartirilgan preview
    bool   is_deleted = 4 [json_name = "is_deleted"];   // asl xabar o'chirilgan bo'lsa true
}

message Message {
    string id                          = 1 [json_name = "id"];
    string sender_id                   = 2 [json_name = "sender_id"];
    string recipient_id                = 3 [json_name = "recipient_id"];
    string content                     = 4 [json_name = "content"];
    repeated string images             = 5 [json_name = "images"];
    repeated string videos             = 6 [json_name = "videos"];
    repeated string voice_messages     = 7 [json_name = "voice_messages"];
    int64 created_at                   = 8 [json_name = "created_at"];
    optional Location location         = 9 [json_name = "location"];
    bool is_read                       = 10 [json_name = "is_read"];
    optional string reply_to_message_id = 11 [json_name = "reply_to_message_id"];
    optional ReplyPreview reply_preview = 12 [json_name = "reply_preview"];
}

message ChatSummary {
    string contact_id    = 1 [json_name = "contact_id"];  // boshqa foydalanuvchi ID si
    Message last_message = 2 [json_name = "last_message"];
    int64 unread_count   = 3 [json_name = "unread_count"];
    bool is_pinned       = 4 [json_name = "is_pinned"];
}

message PinnedChat {
    string contact_id = 1 [json_name = "contact_id"];
    int64 created_at  = 2 [json_name = "created_at"];
}

message SendMessageRequest {
    string recipient_id            = 1 [json_name = "recipient_id"];
    string content                 = 2 [json_name = "content"];
    repeated string images         = 3 [json_name = "images"];
    repeated string videos         = 4 [json_name = "videos"];
    repeated string voice_messages = 5 [json_name = "voice_messages"];
    optional Location location     = 6 [json_name = "location"];
    optional string reply_to_message_id = 7 [json_name = "reply_to_message_id"];
}

message SendMessageResponse {
    Message message = 1 [json_name = "message"];
}

message GetMessagesRequest {
    string contact_id = 1 [json_name = "contact_id"];
    int64 cursor      = 2 [json_name = "cursor"];     // Unix timestamp, 0 = latest
    int32 page_size   = 3 [json_name = "page_size"];   // default 30
}

message GetMessagesResponse {
    repeated Message messages = 1 [json_name = "messages"];
    int64 next_cursor         = 2 [json_name = "next_cursor"];  // 0 = no more
    bool has_more             = 3 [json_name = "has_more"];
}

message UpdateMessageRequest {
    string id                      = 1 [json_name = "id"];
    string content                 = 2 [json_name = "content"];
    repeated string images         = 3 [json_name = "images"];
    repeated string videos         = 4 [json_name = "videos"];
    repeated string voice_messages = 5 [json_name = "voice_messages"];
    optional Location location     = 6 [json_name = "location"];
}

message UpdateMessageResponse {
    Message message = 1 [json_name = "message"];
}

message DeleteMessageRequest {
    string id = 1 [json_name = "id"];
}

message DeleteMessageResponse {}

message GetChatListRequest {}

message GetChatListResponse {
    repeated ChatSummary chats = 1 [json_name = "chats"];
}

message GetUnreadCountRequest {
    string contact_id = 1 [json_name = "contact_id"];
}

message GetUnreadCountResponse {
    int64 count = 1 [json_name = "count"];
}

message MarkMessagesAsReadRequest {
    string          contact_id  = 1 [json_name = "contact_id"];
    repeated string message_ids = 2 [json_name = "message_ids"];
}

message MarkMessagesAsReadResponse {}

message SetChatPinnedRequest {
    string contact_id = 1 [json_name = "contact_id"];
    bool pinned       = 2 [json_name = "pinned"];
}

message SetChatPinnedResponse {}

message GetPinnedChatsRequest {}

message GetPinnedChatsResponse {
    repeated PinnedChat pinned_chats = 1 [json_name = "pinned_chats"];
}

message StreamMessagesRequest {
    string contact_id = 1 [json_name = "contact_id"];  // empty = listen to all incoming messages
    // want_activity — true bo'lsa stream ActivityEvent va PresenceEvent ham yuboradi
    // hamda ochiq turgan vaqtda foydalanuvchi "onlayn" hisoblanadi.
    // Eski ilovalar bu maydonni yubormaydi → stream avvalgidek ishlaydi.
    bool want_activity = 2 [json_name = "want_activity"];
}

// EditEvent — xabar tahrirlandi
message EditEvent {
    Message updated_message = 1 [json_name = "updated_message"];
}

// DeleteEvent — xabar o'chirildi
message DeleteEvent {
    string message_id = 1 [json_name = "message_id"];
    string sender_id  = 2 [json_name = "sender_id"];
}

// ReadReceipt — xabar o'qildi bildirishi
message ReadReceipt {
    string reader_id   = 1 [json_name = "reader_id"];
    string contact_id  = 2 [json_name = "contact_id"];
    int64 last_read_at = 3 [json_name = "last_read_at"];
}

// ChatEvent — StreamMessages orqali keladigan barcha event tiplari
// activity va presence faqat want_activity=true bilan ochilgan streamga keladi.
message ChatEvent {
    oneof event {
        Message       message      = 1;
        EditEvent     edit_event   = 2;
        DeleteEvent   delete_event = 3;
        ReadReceipt   read_receipt = 4;
        ActivityEvent activity     = 5 [json_name = "activity"];
        PresenceEvent presence     = 6 [json_name = "presence"];
    }
}

// ChatListUpdate — StreamChatList orqali chat ro'yxati yangilanishi
// presence yoki activity to'ldirilgan update faqat want_presence=true bilan ochilgan
// streamga keladi. Bunday update da last_message bo'sh va unread_count o'zgarmagan
// (0) bo'ladi — klient ularni xabar yangilanishi deb qabul qilmasligi kerak.
message ChatListUpdate {
    string        contact_id   = 1 [json_name = "contact_id"];
    Message       last_message = 2 [json_name = "last_message"];
    int64         unread_count = 3 [json_name = "unread_count"];
    PresenceEvent presence     = 4 [json_name = "presence"];
    ActivityEvent activity     = 5 [json_name = "activity"];
}

// StreamChatListRequest — filter yo'q, barcha chatlardan update keladi
message StreamChatListRequest {
    // want_presence — true bo'lsa stream suhbatdoshlarning onlayn/oflayn (presence)
    // va yozmoqda/yuklamoqda (activity) yangilanishlarini ham yuboradi hamda ochiq
    // turgan vaqtda foydalanuvchi "onlayn" hisoblanadi. Eski ilovalar bu maydonni
    // yubormaydi → stream avvalgidek ishlaydi.
    bool want_presence = 1 [json_name = "want_presence"];
}

// --- Presence va activity ---

// ChatActivityKind — suhbatdagi vaqtinchalik harakat turi.
enum ChatActivityKind {
    CHAT_ACTIVITY_KIND_UNSPECIFIED     = 0;  // yaroqsiz
    CHAT_ACTIVITY_KIND_TYPING          = 1;  // yozmoqda
    CHAT_ACTIVITY_KIND_UPLOADING_MEDIA = 2;  // rasm/video yubormoqda
    CHAT_ACTIVITY_KIND_UPLOADING_FILE  = 3;  // fayl yubormoqda
    CHAT_ACTIVITY_KIND_CANCEL          = 4;  // harakat to'xtadi (darhol yashirish)
}

// ActivityEvent — "yozmoqda…" kabi vaqtinchalik holat. DB da saqlanmaydi.
message ActivityEvent {
    string           user_id       = 1 [json_name = "user_id"];        // harakat qilayotgan foydalanuvchi
    ChatActivityKind kind          = 2 [json_name = "kind"];
    string           chat_id       = 3 [json_name = "chat_id"];        // DM: qabul qiluvchi nuqtai nazaridan suhbatdosh ID si (= user_id)
    string           group_id      = 4 [json_name = "group_id"];       // guruh: guruh ID si
    int32            expires_in_ms = 5 [json_name = "expires_in_ms"];  // shu vaqtdan keyin yangilanmasa avtomatik yashiriladi
}

// LastSeenVisibility — last_seen qanday ko'rsatilishi.
enum LastSeenVisibility {
    LAST_SEEN_VISIBILITY_UNSPECIFIED = 0;
    LAST_SEEN_VISIBILITY_EXACT       = 1;  // last_seen aniq vaqt (yoki online=true)
    LAST_SEEN_VISIBILITY_RECENTLY    = 2;  // yaqinda (≤ 3 kun)
    LAST_SEEN_VISIBILITY_WITHIN_WEEK = 3;  // shu hafta ichida (≤ 7 kun)
    LAST_SEEN_VISIBILITY_LONG_AGO    = 4;  // ancha oldin (yoki hech qachon)
}

// PresenceEvent — foydalanuvchining onlayn holati / oxirgi faolligi (maxfiylik qo'llangan).
message PresenceEvent {
    string             user_id    = 1 [json_name = "user_id"];
    bool               online     = 2 [json_name = "online"];
    int64              last_seen  = 3 [json_name = "last_seen"];   // Unix seconds; yashirin yoki noma'lum bo'lsa 0
    LastSeenVisibility visibility = 4 [json_name = "visibility"];
}

// SendChatActivityRequest — peer_id yoki group_id dan aynan bittasi.
message SendChatActivityRequest {
    string           peer_id  = 1 [json_name = "peer_id"];
    string           group_id = 2 [json_name = "group_id"];
    ChatActivityKind kind     = 3 [json_name = "kind"];
}

message SendChatActivityResponse {}
