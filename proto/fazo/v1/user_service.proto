syntax = "proto3";

package fazo.v1;

import "fazo/v1/user_types.proto";
import "google/api/annotations.proto";

option go_package = "fazo-service/gen/fazo/v1;fazov1";

service UserService {
    rpc GetMe(GetMeRequest) returns (GetMeResponse) {
        option (google.api.http) = {
            get: "/v1/users/me"
        };
    }

    rpc GetAllUsers(GetAllUsersRequest) returns (GetAllUsersResponse) {
        option (google.api.http) = {
            get: "/v1/users"
        };
    }

    rpc GetUserByID(GetUserByIDRequest) returns (GetUserByIDResponse) {
        option (google.api.http) = {
            get: "/v1/users/{id}"
        };
    }

    rpc GetUserByUsername(GetUserByUsernameRequest) returns (GetUserByUsernameResponse) {
        option (google.api.http) = {
            get: "/v1/users/username/{username}"
        };
    }

    rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
        option (google.api.http) = {
            patch: "/v1/users/me"
            body: "*"
        };
    }

    rpc UpdateUsername(UpdateUsernameRequest) returns (UpdateUsernameResponse) {
        option (google.api.http) = {
            patch: "/v1/users/me/username"
            body: "*"
        };
    }

    rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse) {
        option (google.api.http) = {
            patch: "/v1/users/me/password"
            body: "*"
        };
    }

    rpc GetProfilePictures(GetProfilePicturesRequest) returns (GetProfilePicturesResponse) {
        option (google.api.http) = {
            get: "/v1/users/{user_id}/profile-pictures"
        };
    }

    rpc AddProfilePicture(AddProfilePictureRequest) returns (AddProfilePictureResponse) {
        option (google.api.http) = {
            post: "/v1/users/me/profile-pictures"
            body: "*"
        };
    }

    rpc DeleteProfilePicture(DeleteProfilePictureRequest) returns (DeleteProfilePictureResponse) {
        option (google.api.http) = {
            delete: "/v1/users/me/profile-pictures/{id}"
        };
    }

    rpc SetBackgroundPic(SetBackgroundPicRequest) returns (SetBackgroundPicResponse) {
        option (google.api.http) = {
            put: "/v1/users/me/background"
            body: "*"
        };
    }

    rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse) {
        option (google.api.http) = {
            delete: "/v1/users/me"
        };
    }

    // GetPresence — bir nechta foydalanuvchining onlayn holati / oxirgi faolligi
    // (maxfiylik qoidalari qo'llangan holda).
    rpc GetPresence(GetPresenceRequest) returns (GetPresenceResponse) {
        option (google.api.http) = {
            post: "/v1/users/presence"
            body: "*"
        };
    }

    // SetLastSeenPrivacy — "Oxirgi faollik: Hamma / Hech kim" sozlamasi.
    rpc SetLastSeenPrivacy(SetLastSeenPrivacyRequest) returns (SetLastSeenPrivacyResponse) {
        option (google.api.http) = {
            put: "/v1/users/me/last-seen-privacy"
            body: "*"
        };
    }

    // UpdatePremiumProfile — premium profile decoration (needs active premium).
    rpc UpdatePremiumProfile(UpdatePremiumProfileRequest) returns (UpdatePremiumProfileResponse) {
        option (google.api.http) = {
            patch: "/v1/users/me/premium-profile"
            body: "*"
        };
    }

    // RecordProfileView — the caller opened user_id's profile (once per day counts).
    rpc RecordProfileView(RecordProfileViewRequest) returns (RecordProfileViewResponse) {
        option (google.api.http) = {
            post: "/v1/users/profile-views"
            body: "*"
        };
    }

    // ListProfileViewers — who viewed the caller's profile in the last 30 days.
    // Everyone gets the total; only premium callers get the list.
    rpc ListProfileViewers(ListProfileViewersRequest) returns (ListProfileViewersResponse) {
        option (google.api.http) = {
            get: "/v1/users/me/profile-viewers"
        };
    }
}
