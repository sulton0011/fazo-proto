syntax = "proto3";

package fazo.v1;

option go_package = "fazo-service/gen/fazo/v1;fazov1";

// Types embedded in Post for Elon ads (POST_TYPE_SHOP_CHAT) and Global
// communities (POST_TYPE_GLOBAL_CHAT). They live in their own file so that
// post_types.proto can use them without importing the request files.

enum AdCondition {
    AD_CONDITION_UNSPECIFIED = 0;
    AD_CONDITION_NEW         = 1;
    AD_CONDITION_USED        = 2;
}

enum AdStatus {
    AD_STATUS_UNSPECIFIED     = 0;
    // Visible to everyone.
    AD_STATUS_ACTIVE          = 1;
    // Job ad created but its posting fee is not paid yet (ElonService.PayJobPost);
    // visible only to its owner.
    AD_STATUS_PENDING_PAYMENT = 2;
    // Paid period (published_until) is over; visible only to its owner until
    // renewed with PayJobPost.
    AD_STATUS_EXPIRED         = 3;
    // Hidden by a moderator.
    AD_STATUS_REJECTED        = 4;
}

enum AdCategoryKind {
    AD_CATEGORY_KIND_UNSPECIFIED = 0;
    AD_CATEGORY_KIND_GOODS       = 1;
    AD_CATEGORY_KIND_JOB         = 2;
    AD_CATEGORY_KIND_SERVICE     = 3;
    AD_CATEGORY_KIND_REALTY      = 4;
    AD_CATEGORY_KIND_AUTO        = 5;
    AD_CATEGORY_KIND_OTHER       = 6;
}

enum EmploymentType {
    EMPLOYMENT_TYPE_UNSPECIFIED = 0;
    EMPLOYMENT_TYPE_FULL_TIME   = 1;
    EMPLOYMENT_TYPE_PART_TIME   = 2;
    EMPLOYMENT_TYPE_INTERNSHIP  = 3;
    EMPLOYMENT_TYPE_PROJECT     = 4;
}

enum WorkFormat {
    WORK_FORMAT_UNSPECIFIED = 0;
    WORK_FORMAT_OFFICE      = 1;
    WORK_FORMAT_REMOTE      = 2;
    WORK_FORMAT_HYBRID      = 3;
}

enum ExperienceLevel {
    EXPERIENCE_LEVEL_UNSPECIFIED = 0;
    EXPERIENCE_LEVEL_NONE        = 1;
    EXPERIENCE_LEVEL_JUNIOR      = 2;
    EXPERIENCE_LEVEL_MIDDLE      = 3;
    EXPERIENCE_LEVEL_SENIOR      = 4;
}

// Job / internship details of an ad whose category kind is JOB.
message JobDetails {
    string position                 = 1  [json_name = "position"];
    EmploymentType employment_type  = 2  [json_name = "employment_type"];
    WorkFormat work_format          = 3  [json_name = "work_format"];
    // Whole currency units (so'm for UZS), 0 = not given.
    int64 salary_min                = 4  [json_name = "salary_min"];
    int64 salary_max                = 5  [json_name = "salary_max"];
    // ISO 4217, default "UZS".
    string salary_currency          = 6  [json_name = "salary_currency"];
    bool salary_negotiable          = 7  [json_name = "salary_negotiable"];
    string city                     = 8  [json_name = "city"];
    ExperienceLevel experience      = 9  [json_name = "experience"];
    repeated string requirements    = 10 [json_name = "requirements"];
    repeated string benefits        = 11 [json_name = "benefits"];
    // Free-text employer name when the job is not posted as a company.
    string company_name             = 12 [json_name = "company_name"];
}

message CompanySummary {
    string id       = 1 [json_name = "id"];
    string name     = 2 [json_name = "name"];
    string logo_url = 3 [json_name = "logo_url"];
    // Set by Fazo admins only.
    bool verified   = 4 [json_name = "verified"];
}

enum CommunityCategory {
    COMMUNITY_CATEGORY_UNSPECIFIED = 0;
    COMMUNITY_CATEGORY_UNIVERSITY  = 1;
    COMMUNITY_CATEGORY_SCHOOL      = 2;
    COMMUNITY_CATEGORY_COMPANY     = 3;
    COMMUNITY_CATEGORY_INTEREST    = 4;
    COMMUNITY_CATEGORY_CITY        = 5;
    COMMUNITY_CATEGORY_OTHER       = 6;
}

// Global community data of a POST_TYPE_GLOBAL_CHAT post.
message CommunityInfo {
    CommunityCategory category = 1 [json_name = "category"];
    // Official verified community (set by Fazo admins only).
    bool is_official           = 2 [json_name = "is_official"];
    // e.g. "Rasmiy universitet"; empty unless is_official.
    string official_label      = 3 [json_name = "official_label"];
    // Chip text for the row (replaces the generic "User" chip): the
    // official_label for official communities, else the category name (uz).
    string kind_label          = 4 [json_name = "kind_label"];
    int64 members_count        = 5 [json_name = "members_count"];
    // Distinct members who wrote in the last 24 h (cached up to 10 min).
    // Filled by CommunityService lists only; 0 elsewhere.
    int64 active_today         = 6 [json_name = "active_today"];
    // The caller is the owner, an accepted member or has written in it.
    // Filled by CommunityService only.
    bool is_member             = 7 [json_name = "is_member"];
    int64 last_activity_at     = 8 [json_name = "last_activity_at"];

    // ── Channels / groups (00050) ──
    // GROUP (every member writes) or CHANNEL (only owner / admins write).
    // Chosen at creation, immutable. Filled everywhere (PostService too).
    CommunityKind kind                    = 9  [json_name = "kind"];
    // The caller's role; UNSPECIFIED = not a member. CommunityService only.
    CommunityRole my_role                 = 10 [json_name = "my_role"];
    // What ordinary members of a group may do. CommunityService only.
    CommunityPermissions permissions      = 11 [json_name = "permissions"];
    // Group slow mode: seconds between two messages of one member (owner /
    // admins exempt); 0 = off. CommunityService only.
    int32 slow_mode_seconds               = 12 [json_name = "slow_mode_seconds"];
    // Pinned messages, newest pin first (max 20). GetCommunity only.
    repeated CommunityPinnedMessage pinned = 13 [json_name = "pinned"];
    // The caller turned this community's notifications off (MuteCommunity).
    bool is_muted                         = 14 [json_name = "is_muted"];
    // The caller's admin rights (all true for the owner, all false for
    // members). CommunityService only.
    CommunityAdminRights my_rights        = 15 [json_name = "my_rights"];
    // The caller may write now (member of a group / admin of a channel, not
    // banned, not muted). Slow mode is not reflected. CommunityService only.
    bool can_post                         = 16 [json_name = "can_post"];
    // The caller may create invite links. CommunityService only.
    bool can_invite                       = 17 [json_name = "can_invite"];
    // The caller may pin messages. CommunityService only.
    bool can_pin                          = 18 [json_name = "can_pin"];
    // The caller is muted by an admin until this time (unix s); 0 = not.
    int64 muted_until                     = 19 [json_name = "muted_until"];
    // The caller is banned from this community (cannot join / write).
    bool is_banned                        = 20 [json_name = "is_banned"];
}

enum CommunityKind {
    // Old clients / rows: treated as GROUP.
    COMMUNITY_KIND_UNSPECIFIED = 0;
    COMMUNITY_KIND_GROUP       = 1;
    COMMUNITY_KIND_CHANNEL     = 2;
}

enum CommunityRole {
    // Not a member.
    COMMUNITY_ROLE_UNSPECIFIED = 0;
    COMMUNITY_ROLE_OWNER       = 1;
    COMMUNITY_ROLE_ADMIN       = 2;
    COMMUNITY_ROLE_MEMBER      = 3;
}

// Group-wide rights of ordinary members (owner / admins always may).
message CommunityPermissions {
    // images / videos / voice messages
    bool send_media   = 1 [json_name = "send_media"];
    bool send_links   = 2 [json_name = "send_links"];
    bool pin_messages = 3 [json_name = "pin_messages"];
    // create invite links
    bool invite_users = 4 [json_name = "invite_users"];
}

// Rights of an admin (the owner has all of them).
message CommunityAdminRights {
    // delete other people's messages
    bool delete_messages = 1 [json_name = "delete_messages"];
    // remove / ban / mute members
    bool ban_users       = 2 [json_name = "ban_users"];
    bool pin_messages    = 3 [json_name = "pin_messages"];
    // title / description / slow mode / permissions / is_public
    bool change_info     = 4 [json_name = "change_info"];
}

// Small summary of a pinned community message.
message CommunityPinnedMessage {
    string comment_id = 1 [json_name = "comment_id"];
    string user_id    = 2 [json_name = "user_id"];
    // First 200 characters of the text.
    string text       = 3 [json_name = "text"];
    bool has_media    = 4 [json_name = "has_media"];
    int64 created_at  = 5 [json_name = "created_at"];
    string pinned_by  = 6 [json_name = "pinned_by"];
    int64 pinned_at   = 7 [json_name = "pinned_at"];
}
