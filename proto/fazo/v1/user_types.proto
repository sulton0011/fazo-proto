syntax = "proto3";

package fazo.v1;

import "fazo/v1/auth_types.proto";
import "fazo/v1/chat_types.proto";

option go_package = "fazo-service/gen/fazo/v1;fazov1";

message UpdateUserRequest {
    string full_name = 1 [json_name = "full_name"];
    string bio       = 2 [json_name = "bio"];
    string phone     = 3 [json_name = "phone"];  // optional, E.164
}

message UpdateUserResponse {
    User user = 1 [json_name = "user"];
}

message UpdateUsernameRequest {
    string username = 1 [json_name = "username"];  // empty string removes the username
}

// Attached as an error detail to a FailedPrecondition when the requested
// username is for sale and cannot be claimed for free.
message PaidUsernameDetail {
    string username = 1 [json_name = "username"];
    int64 price     = 2 [json_name = "price"];     // in so'm
    string buy_url  = 3 [json_name = "buy_url"];
}

message UpdateUsernameResponse {
    User user = 1 [json_name = "user"];
}

message UpdatePasswordRequest {
    string old_password = 1 [json_name = "old_password"];
    string new_password = 2 [json_name = "new_password"];
}

message UpdatePasswordResponse {}

message DeleteAccountRequest {
    string password = 1 [json_name = "password"];  // current password, for confirmation
    // For passwordless (phone-only) accounts: a token from SendLoginOtp + VerifyOtp
    // that belongs to the account's own verified phone number.
    string verification_token = 2 [json_name = "verification_token"];
}

message DeleteAccountResponse {}

message AddProfilePictureRequest {
    string url = 1 [json_name = "url"];
}

message AddProfilePictureResponse {
    ProfilePic profile_pic = 1 [json_name = "profile_pic"];
}

message DeleteProfilePictureRequest {
    string id = 1 [json_name = "id"];
}

message DeleteProfilePictureResponse {}

message GetProfilePicturesRequest {
    string user_id = 1 [json_name = "user_id"];
}

message GetProfilePicturesResponse {
    repeated ProfilePic profile_pics = 1 [json_name = "profile_pics"];
}

message SetBackgroundPicRequest {
    string object_key = 1 [json_name = "object_key"];
}

message SetBackgroundPicResponse {
    User user = 1 [json_name = "user"];
}

message GetUserByIDRequest {
    string id = 1 [json_name = "id"];
}

message GetUserByIDResponse {
    User user = 1 [json_name = "user"];
}

message GetUserByUsernameRequest {
    string username = 1 [json_name = "username"];
}

message GetUserByUsernameResponse {
    User user = 1 [json_name = "user"];
}

message GetMeRequest {}

message GetMeResponse {
    User user = 1 [json_name = "user"];
}

enum UserSortBy {
    SORT_BY_UNSPECIFIED = 0;
    SORT_BY_CREATED_AT  = 1;
    SORT_BY_USERNAME    = 2;
    SORT_BY_FULL_NAME   = 3;
}

message GetAllUsersRequest {
    string cursor       = 1 [json_name = "cursor"];      // ULID, optional
    int32 page_size     = 2 [json_name = "page_size"];   // default 20, max 50
    string search       = 3 [json_name = "search"];      // ILIKE on full_name + username
    UserSortBy sort_by  = 4 [json_name = "sort_by"];     // 0 = created_at DESC
}

message GetAllUsersResponse {
    repeated User users = 1 [json_name = "users"];
    string next_cursor  = 2 [json_name = "next_cursor"];
    bool has_more       = 3 [json_name = "has_more"];
}

// --- Presence ---

message GetPresenceRequest {
    repeated string user_ids = 1 [json_name = "user_ids"];  // 1..200 ta
}

message GetPresenceResponse {
    // user_id → presence. O'chirilgan / mavjud bo'lmagan foydalanuvchilar kalitda bo'lmaydi.
    map<string, PresenceEvent> presences = 1 [json_name = "presences"];
}

message SetLastSeenPrivacyRequest {
    LastSeenPrivacy privacy = 1 [json_name = "privacy"];  // EVERYONE yoki NOBODY
}

message SetLastSeenPrivacyResponse {
    User user = 1 [json_name = "user"];
}

// --- Premium profile ---

// Replaces the whole premium profile with these values (send the full state).
// The video avatar is the exception: an empty video_avatar_file_id keeps the
// current one unless clear_video_avatar is set.
message UpdatePremiumProfileRequest {
    // gift_catalog id of a gift the caller owns, or "".
    string badge_gift_id           = 1 [json_name = "badge_gift_id"];
    // Preset id ([a-z0-9_-], 1-32 chars) or "".
    string theme                   = 2 [json_name = "theme"];
    // "#RRGGBB" or "".
    string gradient_from           = 3 [json_name = "gradient_from"];
    string gradient_to             = 4 [json_name = "gradient_to"];
    bool animated_ring             = 5 [json_name = "animated_ring"];
    // file_store id of the caller's own uploaded, ready video.
    string video_avatar_file_id    = 6 [json_name = "video_avatar_file_id"];
    bool clear_video_avatar        = 7 [json_name = "clear_video_avatar"];
    // Username sticker: a sticker id such as "os12" or one emoji / ZWJ
    // sequence; single line, <= 24 characters; "" = none.
    string emoji_status            = 8 [json_name = "emoji_status"];
    // gift_catalog id of a gift the caller owns, or "".
    string emoji_status_gift_id    = 9 [json_name = "emoji_status_gift_id"];
    // At most 3 user_gifts ids the caller owns.
    repeated string showcase_gift_ids = 10 [json_name = "showcase_gift_ids"];
    // Items featured next to the avatar, full replace: at most 5, duplicates
    // removed, order kept; each must be owned by the caller (a user_gifts id,
    // or a username in their collection). Empty clears them.
    repeated FeaturedItemRef featured_items = 11 [json_name = "featured_items"];
}

// Reference to an item to feature next to the avatar.
message FeaturedItemRef {
    // "gift" | "username".
    string kind = 1 [json_name = "kind"];
    // user_gifts.id for a gift, the username (with or without "@") for a username.
    string ref  = 2 [json_name = "ref"];
}

message UpdatePremiumProfileResponse {
    User user = 1 [json_name = "user"];
}

// --- Profile viewers ---

message RecordProfileViewRequest {
    string user_id = 1 [json_name = "user_id"];
}

message RecordProfileViewResponse {}

message ListProfileViewersRequest {
    string cursor = 1 [json_name = "cursor"];
    // Default 20, max 100.
    int32 limit   = 2 [json_name = "limit"];
}

message ProfileViewer {
    User user       = 1 [json_name = "user"];
    // Unix seconds of the viewer's latest view.
    int64 viewed_at = 2 [json_name = "viewed_at"];
}

message ListProfileViewersResponse {
    // Distinct viewers in the last 30 days (for everyone).
    int64 total                    = 1 [json_name = "total"];
    // Premium callers only; empty otherwise.
    repeated ProfileViewer viewers = 2 [json_name = "viewers"];
    string next_cursor             = 3 [json_name = "next_cursor"];
}
