syntax = "proto3";

package fazo.v1;

option go_package = "fazo-service/gen/fazo/v1;fazov1";

message RegisterRequest {
    string full_name = 1 [json_name = "full_name"];
    string username  = 2 [json_name = "username"];
    string password  = 3 [json_name = "password"];
    string phone     = 4 [json_name = "phone"];  // deprecated: ignored, use RegisterWithPhone
}

message RegisterResponse {
    string access_token  = 1 [json_name = "access_token"];
    string refresh_token = 2 [json_name = "refresh_token"];
    User user            = 3 [json_name = "user"];
}

message LoginRequest {
    string username  = 1 [json_name = "username"];
    string password  = 2 [json_name = "password"];
    string fcm_token = 3 [json_name = "fcm_token"];  // optional
    string platform  = 4 [json_name = "platform"];   // optional: ios|android|web
}

message LoginResponse {
    string access_token  = 1 [json_name = "access_token"];
    string refresh_token = 2 [json_name = "refresh_token"];
    User user            = 3 [json_name = "user"];
}

message RefreshTokenRequest {
    string refresh_token = 1 [json_name = "refresh_token"];
    string fcm_token     = 2 [json_name = "fcm_token"];  // optional
    string platform      = 3 [json_name = "platform"];   // optional: ios|android|web
}

message UpdateDeviceTokenRequest {
    string refresh_token = 1 [json_name = "refresh_token"];
    string fcm_token     = 2 [json_name = "fcm_token"];
    string platform      = 3 [json_name = "platform"];  // ios|android|web
}

message UpdateDeviceTokenResponse {}

message RefreshTokenResponse {
    string access_token = 1 [json_name = "access_token"];
}

message LogoutRequest {
    string refresh_token = 1 [json_name = "refresh_token"];
}

message LogoutResponse {}

message ProfilePic {
    string id       = 1 [json_name = "id"];
    string url      = 2 [json_name = "url"];
    int64 posted_at = 3 [json_name = "posted_at"];
}

message User {
    string id                        = 1 [json_name = "id"];
    string full_name                 = 2 [json_name = "full_name"];
    string username                  = 3 [json_name = "username"];
    string phone                     = 4 [json_name = "phone"];
    string bio                       = 5 [json_name = "bio"];
    bool profile_hidden              = 6 [json_name = "profile_hidden"];
    string background_pic            = 7 [json_name = "background_pic"];
    int64 created_at                 = 8 [json_name = "created_at"];
    repeated ProfilePic profile_pics = 9 [json_name = "profile_pics"];
    bool phone_verified              = 10 [json_name = "phone_verified"];
    // last_seen_privacy — faqat o'zi uchun (GetMe, SetLastSeenPrivacy) to'ldiriladi;
    // boshqa foydalanuvchi profilida UNSPECIFIED bo'ladi.
    LastSeenPrivacy last_seen_privacy = 11 [json_name = "last_seen_privacy"];
}

// LastSeenPrivacy — oxirgi faollik (onlayn / oxirgi marta) kimga ko'rinadi.
enum LastSeenPrivacy {
    LAST_SEEN_PRIVACY_UNSPECIFIED = 0;
    LAST_SEEN_PRIVACY_EVERYONE    = 1;  // hamma (standart)
    LAST_SEEN_PRIVACY_NOBODY      = 2;  // hech kim (o'zaro: o'zi ham boshqalarnikini aniq ko'rmaydi)
}

// --- Phone OTP ---

message SendRegistrationOtpRequest {
    string phone = 1 [json_name = "phone"];  // +998XXXXXXXXX; spaces and dashes are stripped
}

message SendRegistrationOtpResponse {
    string otp_id      = 1 [json_name = "otp_id"];
    int32 expires_in   = 2 [json_name = "expires_in"];    // seconds until the code expires
    int32 resend_after = 3 [json_name = "resend_after"];  // seconds until a new code may be requested
}

message SendPasswordResetOtpRequest {
    string username = 1 [json_name = "username"];
}

message SendPasswordResetOtpResponse {
    string otp_id       = 1 [json_name = "otp_id"];
    string masked_phone = 2 [json_name = "masked_phone"];  // e.g. +99890***4567
    int32 expires_in    = 3 [json_name = "expires_in"];
    int32 resend_after  = 4 [json_name = "resend_after"];
}

message VerifyOtpRequest {
    string otp_id = 1 [json_name = "otp_id"];
    string code   = 2 [json_name = "code"];
    // The purpose is taken from the OTP itself: "register" | "password_reset" | "login".
}

message VerifyOtpResponse {
    string verification_token = 1 [json_name = "verification_token"];  // single use, bound to the OTP purpose
    int32 expires_in          = 2 [json_name = "expires_in"];
}

message RegisterWithPhoneRequest {
    string verification_token = 1 [json_name = "verification_token"];
    string username           = 2 [json_name = "username"];   // optional
    string password           = 3 [json_name = "password"];   // optional
    string full_name          = 4 [json_name = "full_name"];
    string fcm_token          = 5 [json_name = "fcm_token"];  // optional
    string platform           = 6 [json_name = "platform"];   // optional: ios|android|web
}

message ResetPasswordRequest {
    string verification_token = 1 [json_name = "verification_token"];
    string new_password       = 2 [json_name = "new_password"];
}

message ResetPasswordResponse {}

// --- Phone login ---

message SendLoginOtpRequest {
    string phone = 1 [json_name = "phone"];  // +998XXXXXXXXX; spaces and dashes are stripped
}

message SendLoginOtpResponse {
    string otp_id      = 1 [json_name = "otp_id"];
    int32 expires_in   = 2 [json_name = "expires_in"];    // seconds until the code expires
    int32 resend_after = 3 [json_name = "resend_after"];  // seconds until a new code may be requested
}

message LoginWithPhoneRequest {
    string verification_token = 1 [json_name = "verification_token"];  // from VerifyOtp with purpose "login"
    string fcm_token          = 2 [json_name = "fcm_token"];           // optional
    string platform           = 3 [json_name = "platform"];            // optional: ios|android|web
}
